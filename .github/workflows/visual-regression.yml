name: Visual Regression Checks

on:
  push:
    branches:
      - visual-refresh
      - main
    paths:
      - '**/*.css'
      - 'index.html'
      - 'visual-system.js'
      - 'dashboard-insights.js'
      - 'remaining-views.js'
      - 'navigation-integrity.js'
      - 'final-router.js'
      - 'route-access-guard.js'
      - 'management-role-router.js'
      - 'workspace-route-stability.js'
      - 'foundation-access.js'
      - 'auth-extension.js'
      - 'tests/browser/**'
      - '.github/workflows/visual-regression.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.css'
      - 'index.html'
      - 'visual-system.js'
      - 'dashboard-insights.js'
      - 'remaining-views.js'
      - 'navigation-integrity.js'
      - 'final-router.js'
      - 'route-access-guard.js'
      - 'management-role-router.js'
      - 'workspace-route-stability.js'
      - 'foundation-access.js'
      - 'auth-extension.js'
      - 'tests/browser/**'
      - '.github/workflows/visual-regression.yml'
  workflow_dispatch:

jobs:
  chromium-responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned Playwright
        run: npm install --no-save @playwright/test@1.62.1

      - name: Verify runner Chrome
        run: google-chrome --version

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/visual-server.log 2>&1 &
          echo $! > /tmp/visual-server.pid

      - name: Run responsive browser tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/browser/*.spec.js --config=tests/browser/playwright.config.js --reporter=line

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
