<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Dashboard insight fixture</title>
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../../ui-refresh.css">
  <link rel="stylesheet" href="../../mobile-fixes.css">
  <link rel="stylesheet" href="../../design-system.css">
  <link rel="stylesheet" href="../../design-system-polish.css">
  <link rel="stylesheet" href="../../mobile-dock.css">
  <link rel="stylesheet" href="../../dashboard-insights.css">
  <link rel="stylesheet" href="../../design-system-accessibility.css">
</head>
<body>
  <div id="app"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const mode = params.get('mode') || 'general';
    const metric = (label,value,small='',tone='blue',icon='•') => `<article class="metric"><div class="metric-top"><div><span>${label}</span><strong>${value}</strong>${small?`<small>${small}</small>`:''}</div><div class="icon ${tone}">${icon}</div></div></article>`;
    const mainNav = `<div class="nav-section">Principal</div><nav class="nav"><a class="${mode==='general'?'active':''}" href="#/"><span>⌂</span>Visão geral</a><a href="#/condominios"><span>▦</span>Condomínios</a><a class="${mode==='finance'?'active':''}" href="#/financeiro"><span>$</span>Financeiro</a><a href="#/calendario"><span>◫</span>Calendário</a><a href="#/manutencoes"><span>⚒</span>Manutenções</a><a href="#/chamados"><span>◉</span>Chamados</a></nav>`;
    const workspaceNav = mode==='condo' ? `<div class="nav-section">Workspace</div><div class="workspace-label">Ed. Ametista</div><nav class="nav"><a class="active" href="#/condominio/condo-a"><span>⌂</span>Resumo</a><a href="#/condominio/condo-a/manutencoes"><span>⚒</span>Manutenções</a><a href="#/condominio/condo-a/chamados"><span>◉</span>Chamados</a><a href="#/condominio/condo-a/documentos"><span>▤</span>Documentos</a></nav>` : '';
    document.body.dataset.mode = mode;
    if(mode==='general') location.hash='#/';
    if(mode==='condo') location.hash='#/condominio/condo-a';
    if(mode==='finance') location.hash='#/financeiro';
    const metrics = mode==='general'
      ? metric('Condomínios','4','176 unidades','blue','🏢')+metric('Chamados abertos','7','','orange','🎫')+metric('Manutenções em 7 dias','3','1 vencida(s)','red','⚒')+metric('Documentos em 30 dias','2','','orange','📄')+metric('Assembleias futuras','1','','blue','🏛️')
      : mode==='condo'
        ? metric('Unidades','41','','blue','🏠')+metric('Chamados abertos','2','1 urgente(s)','orange','🎫')+metric('Manutenções em 7 dias','3','','red','⚒')+metric('Documentos em 30 dias','1','','orange','📄')+metric('Saldo realizado','R$ 8.450,00','Em atraso R$ 0,00','green','$')
        : metric('Recebido','R$ 18.500,00','','green','↗')+metric('Pago','R$ 12.200,00','','orange','↘')+metric('Saldo realizado','R$ 6.300,00','Previsto líquido R$ 7.100,00','blue','$')+metric('Em atraso','R$ 1.200,00','','red','!');
    document.getElementById('app').innerHTML = `<div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">SG</div><div><strong>Gestão Condominial</strong><span>Portal do Síndico</span></div></div>${mainNav}${workspaceNav}</aside><main class="main"><div class="mobile-top"><div class="brand"><div class="brand-mark">SG</div><div><strong>Gestão Condominial</strong><span>${mode==='condo'?'Ed. Ametista':'Portal do Síndico'}</span></div></div></div><header class="topbar"><div><div class="eyebrow">${mode==='finance'?'Gestão':mode==='condo'?'Workspace':'Painel de Gestão'}</div><h1>${mode==='finance'?'Financeiro':mode==='condo'?'Ed. Ametista':'Visão geral'}</h1><div class="muted small">Fixture determinística para regressão visual.</div></div><div class="top-actions"><button class="icon-btn">🔔</button><div class="avatar">TG</div></div></header><section class="metrics">${metrics}</section><article class="panel"><div class="panel-head"><h2>Conteúdo principal</h2></div><div class="panel-body"><div class="empty">Área de conteúdo posterior aos insights.</div></div></article></main></div>`;
    window.CondoAccess = { can(capability,cid){ return mode==='condo' && capability==='finance.review' && cid==='condo-a'; } };
  </script>
  <script src="../../visual-system.js"></script>
  <script src="../../dashboard-insights.js"></script>
</body>
</html>
