<script>
let data={condos:[{id:'c1',name:'Ed. Ametista'},{id:'c2',name:'Monte Belo'}]};
window.CondoAccess={
  getSnapshot:()=>({memberships:[{condominium_id:'c1'},{condominium_id:'c2'}]}),
  canAccessCondo:()=>true,
  can:(cap,cid)=>{
    const allowed=['operations.review','operations.manage','documents.manage','finance.review','team.manage','residents.manage','communications.manage','assemblies.manage'];
    return allowed.includes(cap)&&['c1','c2'].includes(cid);
  }
};
if(!location.hash) location.hash='#/condominio/c1/tarefas';
</script>
