<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>Admin do Sistema • Gestão Condominial</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./ui-refresh.css" />
  <style>
    .sys-admin-body{min-height:100vh;background:radial-gradient(circle at 18% 8%,rgba(70,95,255,.10),transparent 28rem),#f5f6f8}
    .sys-admin-login{min-height:100vh;display:grid;place-items:center;padding:24px}
    .sys-admin-login-card{width:min(430px,100%);background:#fff;border:1px solid #e4e7ed;border-radius:20px;padding:30px;box-shadow:0 28px 80px rgba(20,27,40,.12)}
    .sys-admin-shell{min-height:100vh;display:grid;grid-template-columns:260px 1fr}
    .sys-admin-side{position:fixed;inset:0 auto 0 0;width:260px;background:#151922;color:#fff;padding:20px 15px;display:flex;flex-direction:column}
    .sys-admin-main{grid-column:2;padding:30px 34px 50px;max-width:1500px;width:100%;margin:0 auto}
    .sys-admin-brand{display:flex;gap:11px;align-items:center;padding:4px 5px 22px}
    .sys-admin-brand strong{display:block;font-size:13px}.sys-admin-brand span{display:block;color:#768297;font-size:9px;margin-top:3px}
    .sys-admin-nav-label{font-size:8px;text-transform:uppercase;letter-spacing:.16em;color:#5f6a7d;margin:12px 9px 7px}
    .sys-admin-nav-item{padding:10px 11px;border-radius:9px;background:rgba(255,255,255,.075);color:#fff;font-size:10px}
    .sys-admin-foot{margin-top:auto;padding:12px;border:1px solid rgba(255,255,255,.055);border-radius:12px;background:rgba(255,255,255,.035)}
    .sys-admin-foot small{display:block;color:#788499;font-size:8px}.sys-admin-foot strong{display:block;font-size:10px;margin:5px 0 9px;color:#e8ebf2}
    .sys-admin-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin:18px 0}
    .sys-admin-stat{background:#fff;border:1px solid #e7e9ee;border-radius:14px;padding:15px}.sys-admin-stat span{font-size:9px;color:#89919f}.sys-admin-stat strong{display:block;font-size:24px;margin-top:12px}
    .sys-admin-panel{background:#fff;border:1px solid #e7e9ee;border-radius:14px;margin-bottom:14px;overflow:hidden}.sys-admin-panel-head{padding:16px 17px;border-bottom:1px solid #eef0f3;display:flex;justify-content:space-between;gap:12px;align-items:center}.sys-admin-panel-body{padding:17px}
    .sys-admin-table{width:100%;border-collapse:collapse}.sys-admin-table th,.sys-admin-table td{text-align:left;padding:10px 11px;border-bottom:1px solid #eef0f3;font-size:9px}.sys-admin-table th{font-size:8px;text-transform:uppercase;letter-spacing:.07em;color:#858d9d;background:#f8f9fb}
    .sys-admin-status{padding:8px 10px;border-radius:9px;font-size:9px;margin-top:12px;display:none}.sys-admin-status.show{display:block}.sys-admin-status.error{background:#fff0f0;color:#b84040}.sys-admin-status.ok{background:#edf8f3;color:#177653}
    @media(max-width:820px){.sys-admin-shell{display:block}.sys-admin-side{position:static;width:auto}.sys-admin-main{padding:18px 14px}.sys-admin-grid{grid-template-columns:1fr}.sys-admin-table{min-width:680px}.sys-admin-panel-body{overflow:auto}}
  </style>
</head>
<body class="sys-admin-body">
  <div id="admin-app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>
  <script src="./admin-panel.js"></script>
</body>
</html>
